<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Malcolm Keyes</title>
  <meta name="description" content="Personal site of Malcolm Keyes.">
  <script src="/assets/a11y-widget.js"></script>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #1a1a1a;
      --muted: #555555;
      --accent: #3355dd;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212;
        --fg: #f0f0f0;
        --muted: #b3b3b3;
        --accent: #8aa8ff;
      }
    }

    :root[data-theme="light"] {
      --bg: #ffffff;
      --fg: #1a1a1a;
      --muted: #555555;
      --accent: #3355dd;
    }

    :root[data-theme="dark"] {
      --bg: #121212;
      --fg: #f0f0f0;
      --muted: #b3b3b3;
      --accent: #8aa8ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    .skip-link {
      position: absolute;
      left: -9999px;
      top: 0;
      background: var(--accent);
      color: #fff;
      padding: 0.5rem 1rem;
      z-index: 10;
    }

    .skip-link:focus {
      left: 0.5rem;
      top: 0.5rem;
    }

    main {
      max-width: 40rem;
      margin: 0 auto;
      padding: 2rem clamp(1rem, 5vw, 3rem) 4rem;
    }

    h1 {
      margin-top: 0;
    }

    p {
      color: var(--muted);
    }

    a {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <main id="main">
    <h1>Malcolm Keyes</h1>
    <p>This site is under construction.</p>
  </main>
</body>
</html>
