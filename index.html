<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Malcolm Keyes</title>
  <meta name="description" content="Personal site of Malcolm Keyes.">
  <script src="/assets/a11y-widget.js"></script>
  <link rel="stylesheet" href="/assets/theme.css">
  <style>
    nav[aria-label="Primary"] {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    nav[aria-label="Primary"] ul {
      display: flex;
      gap: 1.5rem;
      max-width: 40rem;
      margin: 0 auto;
      padding: 0.85rem clamp(1rem, 5vw, 3rem);
      list-style: none;
    }

    nav[aria-label="Primary"] a {
      font-weight: 600;
      text-decoration: none;
    }

    nav[aria-label="Primary"] a:hover,
    nav[aria-label="Primary"] a:focus-visible {
      text-decoration: underline;
    }

    h2 {
      font-size: 1.1rem;
    }

    .contact-card {
      display: inline-flex;
      flex-direction: column;
      gap: 0.15rem;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 0.75rem 1rem;
      text-decoration: none;
    }

    .contact-card:hover,
    .contact-card:focus-visible {
      border-color: var(--accent);
    }

    .contact-card strong {
      color: var(--fg);
    }

    .contact-card span {
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <nav aria-label="Primary">
    <ul>
      <li><a href="/tools/">Tools</a></li>
    </ul>
  </nav>

  <main id="main">
    <h1>Malcolm Keyes</h1>
    <p>
      This is Malcolm's dump grounds for random stuff, primarily inspired by
      <a href="https://simonwillison.net/">Simon Willison's blog</a>. I use AI
      where it makes sense.
    </p>

    <section aria-labelledby="contact-heading">
      <h2 id="contact-heading">Contact</h2>
      <a class="contact-card" href="https://www.linkedin.com/in/malcolm-keyes">
        <strong>LinkedIn</strong>
        <span>linkedin.com/in/malcolm-keyes</span>
      </a>
    </section>
  </main>
</body>
</html>
